<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Library Manager logo">
  <title>Library Manager</title>

  <!--
    The application's only icon artwork. AppIcon rasterises this same file for the
    window and dock, so the mark is authored once and cannot drift between the two.

    Three books standing side by side. Two things keep it readable when scaled
    down to a 16px dock tile, both of which the earlier version of this mark got
    wrong:

      - the bodies are wide relative to the gaps, so the gaps are still visible
        once a pixel is worth more than a unit
      - the middle volume is a lighter indigo, so the three read as separate
        objects even where the gaps have blurred away

    Differing heights and the ruled spine bands give it something to read at
    larger sizes; the bands disappear harmlessly when small.
  -->

  <defs>
    <!-- Indigo ramp, matching the application's accent colour. -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>

    <!-- A soft highlight so the tile does not read as flat colour. -->
    <radialGradient id="sheen" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#tile)"/>
  <rect width="96" height="96" rx="22" fill="url(#sheen)"/>

  <!-- Left volume. All three stand on the same line at y=72. -->
  <g>
    <rect x="23.5" y="32" width="15" height="40" rx="3.5" fill="#FFFFFF"/>
    <g fill="#4F46E5" opacity="0.3">
      <rect x="27" y="37.5" width="8" height="2.4" rx="1.2"/>
      <rect x="27" y="42.5" width="8" height="2.4" rx="1.2"/>
    </g>
  </g>

  <!-- Middle volume: tallest, and the lighter tone that separates the trio. -->
  <g>
    <rect x="40.5" y="24" width="15" height="48" rx="3.5" fill="#C7D2FE"/>
    <g fill="#3730A3" opacity="0.38">
      <rect x="44" y="29.5" width="8" height="2.4" rx="1.2"/>
      <rect x="44" y="34.5" width="8" height="2.4" rx="1.2"/>
    </g>
  </g>

  <!-- Right volume: shortest, so the skyline is not symmetrical. -->
  <g>
    <rect x="57.5" y="36" width="15" height="36" rx="3.5" fill="#FFFFFF"/>
    <g fill="#4F46E5" opacity="0.3">
      <rect x="61" y="41.5" width="8" height="2.4" rx="1.2"/>
      <rect x="61" y="46.5" width="8" height="2.4" rx="1.2"/>
    </g>
  </g>
</svg>
