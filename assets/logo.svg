<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="Library Manager logo">
  <title>Library Manager</title>

  <defs>
    <!-- Indigo ramp, matching the application's accent colour. -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>

    <!-- A soft highlight so the tile does not read as flat colour. -->
    <radialGradient id="sheen" cx="0.25" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="96" height="96" rx="22" fill="url(#tile)"/>
  <rect width="96" height="96" rx="22" fill="url(#sheen)"/>

  <!-- Three book spines standing on a shelf: the same mark used in the sidebar. -->
  <g fill="#FFFFFF">
    <rect x="24" y="38" width="14" height="34" rx="3.5" opacity="0.92"/>
    <rect x="42" y="27" width="14" height="45" rx="3.5"/>
    <rect x="60" y="42" width="14" height="30" rx="3.5" opacity="0.82"
          transform="rotate(9 67 72)"/>

    <!-- Spine bands, hinting at printed titles. -->
    <g fill="#4338CA" opacity="0.45">
      <rect x="27" y="45" width="8" height="2.6" rx="1.3"/>
      <rect x="45" y="34" width="8" height="2.6" rx="1.3"/>
    </g>

    <!-- The shelf. -->
    <rect x="19" y="74" width="58" height="5" rx="2.5" opacity="0.95"/>
  </g>
</svg>
